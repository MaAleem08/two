<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4facfe;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4facfe;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #2196f3;
        }

        .result {
            margin-top: 25px;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .result h2 {
            margin-bottom: 10px;
            color: #222;
        }

        .result p {
            margin: 8px 0;
            font-size: 16px;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Diabetes Prediction</h1>

        <div class="input-group">
            <label>Pregnancies</label>
            <input type="number" id="Pregnancies" step="any">
        </div>

        <div class="input-group">
            <label>Glucose</label>
            <input type="number" id="Glucose" step="any">
        </div>

        <div class="input-group">
            <label>Blood Pressure</label>
            <input type="number" id="BloodPressure" step="any">
        </div>

        <div class="input-group">
            <label>Skin Thickness</label>
            <input type="number" id="SkinThickness" step="any">
        </div>

        <div class="input-group">
            <label>Insulin</label>
            <input type="number" id="Insulin" step="any">
        </div>

        <div class="input-group">
            <label>BMI</label>
            <input type="number" id="BMI" step="any">
        </div>

        <div class="input-group">
            <label>Diabetes Pedigree Function</label>
            <input type="number" id="DiabetesPedigreeFunction" step="any">
        </div>

        <div class="input-group">
            <label>Age</label>
            <input type="number" id="Age" step="any">
        </div>

        <button onclick="predictDiabetes()">Predict</button>

        <div class="error" id="error"></div>

        <div class="result" id="resultBox">
            <h2>Prediction Result</h2>
            <p id="prediction"></p>
            <p id="diabeticProb"></p>
            <p id="notDiabeticProb"></p>
        </div>
    </div>

    <script>
        async function predictDiabetes() {

            document.getElementById('error').innerText = "";

            const data = {
                Pregnancies: parseFloat(document.getElementById('Pregnancies').value),
                Glucose: parseFloat(document.getElementById('Glucose').value),
                BloodPressure: parseFloat(document.getElementById('BloodPressure').value),
                SkinThickness: parseFloat(document.getElementById('SkinThickness').value),
                Insulin: parseFloat(document.getElementById('Insulin').value),
                BMI: parseFloat(document.getElementById('BMI').value),
                DiabetesPedigreeFunction: parseFloat(document.getElementById('DiabetesPedigreeFunction').value),
                Age: parseFloat(document.getElementById('Age').value)
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById('resultBox').style.display = 'block';

                document.getElementById('prediction').innerHTML =
                    `<strong>Status:</strong> ${result.Diabetic}`;

                document.getElementById('diabeticProb').innerHTML =
                    `<strong>Probability of Diabetic:</strong> ${result['probability of Diabetic']}%`;

                document.getElementById('notDiabeticProb').innerHTML =
                    `<strong>Probability of Not Diabetic:</strong> ${result['probability of Not Diabetic']}%`;

            } catch (error) {
                document.getElementById('error').innerText =
                    'Error connecting to FastAPI backend';
            }
        }
    </script>

</body>
</html>
